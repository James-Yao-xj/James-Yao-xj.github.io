<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="title description">
  <title id="title">Dijkstra 算法示例</title>
  <desc id="description">S 到 A 的权重为 4，到 B 为 1；A 到 C 为 1，B 到 C 为 2；C 到 D 为 3。</desc>
  <rect width="600" height="400" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#35536d"/>
    </marker>
  </defs>
  <g fill="none" stroke="#35536d" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M284 57 175 128"/>
    <path d="M316 57 425 128"/>
    <path d="M175 152 284 238"/>
    <path d="M425 152 316 238"/>
    <path d="M300 270 300 345"/>
  </g>
  <g fill="#ffffff" stroke="#35536d" stroke-width="2.5">
    <circle cx="300" cy="45" r="20"/>
    <circle cx="160" cy="140" r="20"/>
    <circle cx="440" cy="140" r="20"/>
    <circle cx="300" cy="250" r="20"/>
    <circle cx="300" cy="365" r="20"/>
  </g>
  <g fill="#172b3a" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle">
    <text x="300" y="46">S</text>
    <text x="160" y="141">A</text>
    <text x="440" y="141">B</text>
    <text x="300" y="251">C</text>
    <text x="300" y="366">D</text>
  </g>
  <g fill="#ffffff" stroke="#d5dfe7" stroke-width="1">
    <rect x="208" y="72" width="30" height="26" rx="5"/>
    <rect x="362" y="72" width="30" height="26" rx="5"/>
    <rect x="208" y="177" width="30" height="26" rx="5"/>
    <rect x="362" y="177" width="30" height="26" rx="5"/>
    <rect x="316" y="298" width="30" height="26" rx="5"/>
  </g>
  <g fill="#172b3a" font-family="Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle" dominant-baseline="middle">
    <text x="223" y="86">4</text>
    <text x="377" y="86">1</text>
    <text x="223" y="191">1</text>
    <text x="377" y="191">2</text>
    <text x="331" y="312">3</text>
  </g>
</svg>
