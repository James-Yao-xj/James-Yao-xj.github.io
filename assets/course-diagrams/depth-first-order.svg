<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title description">
  <title id="title">深度优先拓扑排序示例</title>
  <desc id="description">A 指向 B 和 C；B 指向 D；C 指向 E。</desc>
  <rect width="600" height="300" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0 9 4.5 0 9Z" fill="#35536d"/>
    </marker>
  </defs>
  <g fill="none" stroke="#35536d" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M284 57 185 133"/>
    <path d="M316 57 415 133"/>
    <path d="M170 165 170 245"/>
    <path d="M430 165 430 245"/>
  </g>
  <g fill="#ffffff" stroke="#35536d" stroke-width="2.5">
    <circle cx="300" cy="45" r="20"/>
    <circle cx="170" cy="145" r="20"/>
    <circle cx="430" cy="145" r="20"/>
    <circle cx="170" cy="265" r="20"/>
    <circle cx="430" cy="265" r="20"/>
  </g>
  <g fill="#172b3a" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle" dominant-baseline="middle">
    <text x="300" y="46">A</text>
    <text x="170" y="146">B</text>
    <text x="430" y="146">C</text>
    <text x="170" y="266">D</text>
    <text x="430" y="266">E</text>
  </g>
</svg>
