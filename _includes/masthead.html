{% include base_path %}
<header class="masthead">
  <nav class="site-navigation" aria-label="主导航">
    <a class="site-brand" href="{{ base_path }}/">{{ site.title }}</a>
    <div class="site-controls">
      <button id="theme-toggle" class="icon-control" type="button" aria-label="切换深浅色主题">
        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></svg>
      </button>
      <button class="menu-toggle icon-control" type="button" aria-expanded="false" aria-controls="primary-links" aria-label="打开导航菜单"><span></span><span></span></button>
    </div>
    <ul id="primary-links" class="primary-links">
      {% for link in site.data.navigation.main %}
        {% assign selected = false %}
        {% if page.url contains link.url and link.url != '/' %}{% assign selected = true %}{% endif %}
        <li><a href="{% unless link.url contains 'http' %}{{ base_path }}{% endunless %}{{ link.url }}"{% if selected %} aria-current="page"{% endif %}>{{ link.title }}<span aria-hidden="true">→</span></a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
<span class="page-top-sentinel" aria-hidden="true"></span>
